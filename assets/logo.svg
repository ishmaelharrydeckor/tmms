<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for text paths and filters -->
  <defs>
    <!-- Path for the top text (clockwise) -->
    <path id="topTextPath" d="M 70,250 A 180,180 0 0,1 430,250" fill="none" />
    <!-- Path for the bottom text (clockwise, adjusted to read correctly) -->
    <path id="bottomTextPath" d="M 430,250 A 180,180 0 0,1 70,250" fill="none" />
    
    <!-- Premium drop shadow for the logo -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring (Royal Blue) -->
  <circle cx="250" cy="250" r="230" fill="#002E6E" stroke="#FFFFFF" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Inner Separator Ring -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="none" />
  
  <!-- Text: THE MISSION MAGNIFICAT SCHOOL -->
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="21.5" font-weight="900" fill="#FFFFFF" letter-spacing="4">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">THE MISSION MAGNIFICAT SCHOOL</textPath>
  </text>
  
  <!-- Text: KNOWLEDGE & VIRTUE -->
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" letter-spacing="5">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">KNOWLEDGE &amp; VIRTUE</textPath>
  </text>

  <!-- Decorative Stars on Sides -->
  <g fill="#D4AF37">
    <!-- Left Star -->
    <path d="M 62,250 L 66,244 L 72,244 L 68,249 L 70,255 L 65,251 L 60,254 L 62,249 Z" transform="rotate(-15, 65, 250)" />
    <!-- Right Star -->
    <path d="M 438,250 L 442,244 L 448,244 L 444,249 L 446,255 L 441,251 L 436,254 L 438,249 Z" transform="rotate(15, 441, 250)" />
  </g>

  <!-- Center Circle for Emblem -->
  <circle cx="250" cy="250" r="162" fill="#002E6E" />

  <!-- Center Graphic: Stylized 'M' with Graduate and Wings -->
  <g transform="translate(250, 255) scale(0.95)">
    <!-- Wings (Behind M) -->
    <!-- Left Wing -->
    <path d="M -90,-25 C -110,-55 -80,-85 -40,-65 C -55,-55 -60,-40 -50,-25 Z" fill="#FFFFFF" opacity="0.9"/>
    <!-- Right Wing -->
    <path d="M 90,-25 C 110,-55 80,-85 40,-65 C 55,-55 60,-40 50,-25 Z" fill="#FFFFFF" opacity="0.9"/>

    <!-- Central Stylized 'M' Shape -->
    <!-- Drawn as a thick, elegant white polygon matching the logo crest -->
    <path d="M -110,65 L -75,65 L -45,-30 L 0,20 L 45,-30 L 75,65 L 110,65 L 60,-65 L 45,-65 L 0,-20 L -45,-65 L -60,-65 Z" fill="#FFFFFF" />

    <!-- Graduate Figure in the Center -->
    <g transform="translate(0, -10)">
      <!-- Head / Mortarboard Cap -->
      <path d="M -16,-48 L 0,-56 L 16,-48 L 0,-40 Z" fill="#FFFFFF" stroke="#002E6E" stroke-width="2"/>
      <path d="M -8,-44 L -8,-38 C -8,-34 8,-34 8,-38 L 8,-44" fill="#FFFFFF" stroke="#002E6E" stroke-width="2"/>
      <line x1="12" y1="-46" x2="16" y2="-36" stroke="#D4AF37" stroke-width="2" />
      <circle cx="16" cy="-35" r="2" fill="#D4AF37" />
      
      <!-- Graduate Face -->
      <circle cx="0" cy="-32" r="7.5" fill="#FFFFFF" stroke="#002E6E" stroke-width="2"/>
      
      <!-- Gown/Body Silhouette inside the V of M -->
      <path d="M -18,-15 C -18,-25 -8,-27 0,-27 C 8,-27 18,-25 18,-15 C 18,-5 12,25 12,25 L -12,25 C -12,25 -18,-5 -18,-15 Z" fill="#FFFFFF" stroke="#002E6E" stroke-width="2"/>
      
      <!-- Golden Tie / V-Neck Stole -->
      <path d="M -6,-25 L 0,-15 L 6,-25 L 3,-27 L -3,-27 Z" fill="#D4AF37" />
      <path d="M 0,-15 L -4,12 L 4,12 Z" fill="#D4AF37" />
    </g>
  </g>
</svg>
